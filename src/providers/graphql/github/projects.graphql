query Repositories($login: String!, $after: String, $includeForks: Boolean, $first: Int!) {
    repositoryOwner(login: $login) {
        __typename,
        repositories(first: $first, after: $after, isFork: $includeForks) {
            pageInfo {
                hasNextPage
                endCursor
            }
            nodes {
                nameWithOwner,
                url
                sshUrl,
                isArchived,
                defaultBranchRef {
                    name
                },
                parent {
                    url
                    sshUrl,
                }
            }
        }
    }
}
