query RepositoriesByStars($login: String!, $include_forks: Boolean, $after: String, $first: Int!) {
  repositoryOwner(login: $login) {
    __typename
    repositories(
      first: $first
      after: $after
      isFork: $include_forks
      orderBy: { field: STARGAZERS, direction: DESC }
    ) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        nameWithOwner
        url
        isArchived
        isFork
        defaultBranchRef {
          name
        }
      }
    }
  }
}