query Repositories($name: ID!, $after: String, $first: Int!) {
    namespace(fullPath: $name) {
        projects(includeSubgroups: true, after: $after, first: $first) {
            edges {
                node {
                    archived,
                    fullPath,
                    sshUrlToRepo,
                    httpUrlToRepo,
                    repository {
                        rootRef
                    }
                }
            }
            pageInfo {
                hasNextPage,
                endCursor,
            }
        }
    }
    group(fullPath: $name) {
        projects(includeSubgroups: true, after: $after, first: $first) {
            edges {
                node {
                    archived,
                    fullPath,
                    sshUrlToRepo,
                    httpUrlToRepo,
                    repository {
                        rootRef
                    }
                }
            },
            pageInfo {
                hasNextPage,
                endCursor,
            }
        }
    }
}
